name: Weekly Health Check

on:
  schedule:
    - cron: '0 9 * * 1'   # 09:00 UTC every Monday
  workflow_dispatch:        # Allow manual triggering

permissions:
  contents: write
  pull-requests: write
  actions: write            # starts the sheet sync after the Sheet is corrected

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Avoid racing the Google Sheet sync, which regenerates catalog.json
    concurrency:
      group: health-check
      cancel-in-progress: true

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: main

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

    - name: Install dependencies
      run: pip install requests pandas gspread oauth2client

    - name: Run unit tests
      run: python -m unittest discover -s scripts/tests -t scripts

    - name: Run health check
      env:
        # GITHUB_TOKEN allows 1,000 REST requests per hour per repository; a run uses about 350
        # and health_check.py stops at 800 (--github-budget).
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        RUN_TIMESTAMP=$(date -u +'%Y-%m-%d') python scripts/health_check.py --summary pr_body.md

    - name: Commit and push results
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "GitHub Actions (Health Check)"
        git config --global user.email "actions@github.com"
        git add public/data/health.json docs/data/health.json
        if git diff --staged --quiet; then
          echo "No health changes to commit."
          exit 0
        fi
        BRANCH="auto/health-check-$(date -u +'%Y%m%d')"
        git checkout -b "$BRANCH"
        git commit -m "Weekly health check $(date -u +'%Y-%m-%d')"
        git push -u origin "$BRANCH"
        gh pr create --title "Weekly health check $(date -u +'%Y-%m-%d')" \
          --body-file pr_body.md \
          --base main
        PR_NUM=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
        # Enable auto-merge (queues behind required checks, if any are ever added). When the
        # PR is already mergeable, GitHub rejects --auto with "clean status", so fall back to
        # an immediate squash merge.
        gh pr merge "$PR_NUM" --squash --auto \
          || gh pr merge "$PR_NUM" --squash \
          || echo "::notice::Merge failed. PR #$PR_NUM needs manual merge."

    - name: Create service account credentials
      env:
        GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
      run: |
        CRED_FILE="data_sources/google_sheets_api/service_account_JN.json"
        mkdir -p "$(dirname "$CRED_FILE")"
        printf '%s' "${GOOGLE_SHEETS_CREDENTIALS}" > "$CRED_FILE"
        if ! python -m json.tool "$CRED_FILE" > /dev/null 2>&1; then
          echo "::error::Invalid JSON in credentials file. Check the GOOGLE_SHEETS_CREDENTIALS secret."
          exit 1
        fi

    # Licences and outdated links in the master Sheet, corrected from what the sources declare
    # (docs/health-thresholds.md, Part 5). More than 30 changes write nothing and fail this step.
    - name: Correct the master Sheet from the sources
      id: corrections
      run: python scripts/sheet_corrections.py --apply --summary corrections.md

    - name: Show the corrections
      if: always() && hashFiles('corrections.md') != ''
      run: cat corrections.md >> "$GITHUB_STEP_SUMMARY"

    - name: Rebuild the site from the corrected Sheet
      if: steps.corrections.outputs.written != '' && steps.corrections.outputs.written != '0'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh workflow run update_from_google_sheets.yml --ref main
